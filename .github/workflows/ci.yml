name: CareerLM CI

run-name: >-
  CareerLM CI | ${{ github.event_name }} |
  build ${{ github.run_number }}.${{ github.run_attempt }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careerlm-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Display runtime versions
        run: |
          node --version
          npm --version

      - name: Generate CareerLM build metadata
        id: build_meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_ID="careerlm-build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}"

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

          {
            echo "CareerLM Build ID: $BUILD_ID"
            echo "Commit SHA: $GITHUB_SHA"
            echo "Git Ref: $GITHUB_REF"
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Workflow Run Number: $GITHUB_RUN_NUMBER"
            echo "Workflow Run Attempt: $GITHUB_RUN_ATTEMPT"
            echo "Repository: $GITHUB_REPOSITORY"
          } > build-info.txt

          echo "### CareerLM CI Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build ID: \`$BUILD_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: \`$GITHUB_EVENT_NAME\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run automated tests
        run: npm run test --if-present

      - name: Build production application
        run: npm run build

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_meta.outputs.build_id }}
          path: build-info.txt
          retention-days: 30
          if-no-files-found: error