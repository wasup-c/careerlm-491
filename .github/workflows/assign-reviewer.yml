name: Assign Pull Request Reviewer

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  pull-requests: write

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest

    steps:
      - name: Request assigned reviewers
        uses: actions/github-script@v7
        with:
          script: |
            // Get the GitHub username of the PR author
            const author = context.payload.pull_request.user.login;

            // List of all team members
            const teamMembers = [
              "wasup-c",
              "SeatedGamer",
              "adriancancode",
              "david15tran",
              "jasev24"
            ];

            // Select everyone except the PR author
            const reviewers = teamMembers.filter(
              member => member.toLowerCase() !== author.toLowerCase()
            );

            // Check if there are reviewers available
            if (reviewers.length === 0) {
              core.notice(`No reviewers available for ${author}`);
              return;
            }

            // Request reviews from all eligible team members
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              reviewers: reviewers
            });

            // Log the assigned reviewers
            core.notice(
              `Requested reviews from ${reviewers.join(", ")} for PR opened by ${author}`
            );